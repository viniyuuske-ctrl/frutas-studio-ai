</body>
<script>
/*
 FRUTINHAS AI 4.0
 Extensão para o Frutas Studio AI 3.0.
 Preserva o código e os episódios anteriores.
*/
(function(){
"use strict";

const el=id=>document.getElementById(id);
const CONFIG_KEY="frutinhas_4_roteirista_config";

const style=document.createElement("style");
style.textContent=`
.fr4-panel{
background:linear-gradient(145deg,#39203e,#23162f);
border:1px solid #a45c91;
border-radius:18px;
padding:18px;
margin-bottom:18px
}
.fr4-panel h2{color:#ff91c9}
.fr4-panel textarea{min-height:100px}
.fr4-panel button{width:100%}
.fr4-panel .fr4-note{
font-size:13px;
color:#e4c9e0;
line-height:1.5
}
.fr4-panel details{margin-top:15px}
.fr4-panel summary{
cursor:pointer;
font-weight:bold;
color:#ffb4d9
}
.fr4-status{
white-space:pre-wrap;
overflow-wrap:anywhere;
background:#170f21;
padding:12px;
border-radius:10px;
margin-top:12px
}
`;
document.head.appendChild(style);

const panel=document.createElement("section");
panel.className="fr4-panel";

panel.innerHTML=`
<h2>🧠 Roteirista Emocional 4.0</h2>

<p>
Crie histórias com diálogos naturais,
sentimentos humanos, pausas dramáticas
e continuidade entre episódios.
</p>

<label>Emoção principal</label>
<select id="fr4-emocao">
<option>Ciúme e desconfiança</option>
<option>Amor e saudade</option>
<option>Medo e suspense</option>
<option>Culpa e arrependimento</option>
<option>Raiva e traição</option>
<option>Esperança e alegria</option>
<option>Tristeza e despedida</option>
</select>

<label>O que aconteceu no episódio anterior?</label>
<textarea id="fr4-anterior"
placeholder="Exemplo: Melissa viu Enzo escondendo uma mensagem de Jade."></textarea>

<label>Instruções especiais</label>
<textarea id="fr4-extra"
placeholder="Exemplo: Melissa tenta não chorar. Enzo fala baixo e evita olhar nos olhos dela."></textarea>

<button type="button" id="fr4-gerar">
❤️ Gerar roteiro humanizado com IA
</button>

<button type="button" class="secondary"
id="fr4-copiar">
📋 Copiar pedido para ChatGPT
</button>

<div class="fr4-status" id="fr4-status">
O criador original continua disponível.
Para gerar com IA automaticamente,
configure um servidor de IA.
</div>

<details>
<summary>⚙️ Configurar conexão com IA</summary>

<label>Endereço HTTPS do servidor</label>
<input type="url" id="fr4-url"
placeholder="https://meu-worker.workers.dev">

<label>PIN de acesso (se necessário)</label>
<input type="password" id="fr4-pin"
autocomplete="off">

<button type="button" class="secondary"
id="fr4-config">
Salvar conexão
</button>

<p class="fr4-note">
Não coloque sua chave do Hugging Face
ou de qualquer modelo neste HTML.
A chave deve ficar protegida no servidor.
</p>
</details>

<p class="fr4-note">
As vozes, efeitos, estilos, formatos,
episódios, prompts e backups da versão
anterior continuam disponíveis.
</p>
`;

const main=document.querySelector("main");
const primeiraSecao=main.querySelector("section");

primeiraSecao.insertAdjacentElement(
"afterend",panel
);

const titulo=document.querySelector("header h1");
if(titulo){
titulo.textContent="🍓 FRUTINHAS AI 4.0";
}

function configuracao(){
try{
return JSON.parse(
localStorage.getItem(CONFIG_KEY)||"{}"
);
}catch{
return {};
}
}

const config=configuracao();
el("fr4-url").value=config.url||"";
el("fr4-pin").value=config.pin||"";

function dados(){
return {
serie:el("serie").value.trim(),
episodio:Number(el("episodio").value),
ideia:el("ideia").value.trim(),
personagens:el("personagens").value.trim(),
estilo:el("estilo").value,
formato:el("formato").value,
tom:el("tom").value,
duracao:Number(el("duracao").value),
quantidade:Number(el("quantidade").value),
idioma:el("idioma").value,
emocao:el("fr4-emocao").value,
anterior:el("fr4-anterior").value.trim(),
extra:el("fr4-extra").value.trim()
};
}

function criarPrompt(d){
return `
Você é um roteirista brasileiro
especializado em novelas e animações
com personagens antropomórficos.

Escreva uma história ORIGINAL, inteligente,
emocionante e cinematográfica.

DADOS DA PRODUÇÃO:
Série: ${d.serie}
Episódio: ${d.episodio}
Ideia: ${d.ideia}
Personagens: ${d.personagens}
Estilo: ${d.estilo}
Formato: ${d.formato}
Tom: ${d.tom}
Emoção dominante: ${d.emocao}
Número de cenas: ${d.quantidade}
Segundos por cena: ${d.duracao}
Idioma: ${d.idioma}

EPISÓDIO ANTERIOR:
${d.anterior||"Não informado"}

DIREÇÃO ESPECIAL:
${d.extra||"Nenhuma"}

REGRAS OBRIGATÓRIAS:

1. Personagens devem sentir e agir
como pessoas de verdade.

2. Demonstre medo, amor, culpa, ciúme,
insegurança, vergonha e saudade
quando fizer sentido para a história.

3. Evite diálogos robóticos e frases
genéricas repetidas.

4. Use português brasileiro natural.

5. Use vírgulas, hesitações,
frases interrompidas e subtexto.

6. Inclua pausas expressivas de
0,5 a 3 segundos quando necessário.

7. Descreva respiração, olhares,
movimentos das mãos e expressões faciais.

8. O silêncio também conta uma história.

9. Cada personagem deve manter sua
personalidade e seus segredos.

10. Preserve a continuidade dos episódios.

11. Não explique tudo em voz alta.
Mostre sentimentos pelas ações.

12. Respeite a duração das cenas.
Não escreva diálogos longos demais
para o tempo disponível.

13. Crie tensão crescente e um
gancho emocionante na última cena.

14. Os prompts de vídeo devem manter
a aparência dos personagens consistente.

15. Não inclua legendas ou letras
nas imagens geradas.

FORMATO DE RESPOSTA:
Responda SOMENTE com um objeto JSON válido.
Não use markdown nem blocos de código.

O JSON deve ter esta estrutura:

{
  "cenas": [
    {
      "numero": 1,
      "acao": "Ações, gestos, emoções e pausas",
      "dialogo": "Nome: fala natural...",
      "som": "Trilha e efeitos sonoros",
      "promptVideo": "Descrição cinematográfica",
      "promptAudio": "Direção de voz e emoções"
    }
  ]
}

Gere exatamente ${d.quantidade} cenas,
numeradas de 1 a ${d.quantidade}.

Cada cena deve ter aproximadamente
${d.duracao} segundos.

Preencha todos os campos com
conteúdo específico, não genérico.
`;
}

function status(texto){
el("fr4-status").textContent=texto;
}

el("fr4-config").onclick=function(){
const url=el("fr4-url").value.trim()
.replace(/\/$/,"");

if(url&&!/^https:\/\//i.test(url)){
alert("Use um endereço HTTPS.");
return;
}

try{
localStorage.setItem(
CONFIG_KEY,
JSON.stringify({
url,
pin:el("fr4-pin").value
})
);
status("Configuração salva neste navegador.");
}catch(e){
status("Não foi possível salvar a configuração.");
}
};

el("fr4-copiar").onclick=function(){
const d=dados();

if(!d.ideia){
alert("Escreva a ideia da história.");
return;
}

copiarTexto(criarPrompt(d));
};

function extrairCenas(resposta){
let conteudo=resposta;

if(typeof conteudo==="string"){
let texto=conteudo.trim();

texto=texto.replace(
/^```(?:json)?\s*/i,""
).replace(/```\s*$/,"");

conteudo=JSON.parse(texto);
}

if(conteudo&&
typeof conteudo==="object"&&
typeof conteudo.text==="string"){
return extrairCenas(conteudo.text);
}

if(!conteudo||
!Array.isArray(conteudo.cenas)){
throw new Error(
"A IA não devolveu uma lista de cenas válida."
);
}

return conteudo.cenas;
}

function validarCenas(cenas,d){
if(cenas.length!==d.quantidade){
throw new Error(
"A IA gerou "+cenas.length+
" cenas, mas foram pedidas "+
d.quantidade+"."
);
}

return cenas.map((c,i)=>{
if(!c||typeof c!=="object"){
throw new Error("Cena inválida.");
}

const campos=[
"acao","dialogo","som",
"promptVideo","promptAudio"
];

for(const campo of campos){
if(typeof c[campo]!=="string"||
!c[campo].trim()){
throw new Error(
"Faltou o campo "+campo+
" na cena "+(i+1)+"."
);
}
}

return {
numero:i+1,
duracao:d.duracao,
acao:c.acao,
dialogo:c.dialogo,
som:c.som,
promptVideo:c.promptVideo,
promptAudio:c.promptAudio
};
});
}

el("fr4-gerar").onclick=async function(){
const d=dados();

if(!d.ideia){
alert("Escreva a ideia do episódio.");
return;
}

const config=configuracao();

if(!config.url){
status(
"Ainda não existe um servidor de IA conectado.\n"+
"Use o botão Copiar pedido para ChatGPT "+
"ou configure o servidor primeiro.\n"+
"O criador original continua funcionando."
);
return;
}

const botao=el("fr4-gerar");
botao.disabled=true;
status("🧠 A IA está escrevendo seu roteiro...");

try{
const resposta=await fetch(
config.url+"/generate",{
method:"POST",
headers:{
"Content-Type":"application/json",
"X-Studio-Pin":config.pin||""
},
body:JSON.stringify({
prompt:criarPrompt(d)
})
}
);

const texto=await resposta.text();

let resultado;

try{
resultado=JSON.parse(texto);
}catch{
throw new Error(
"O servidor não devolveu JSON válido."
);
}

if(!resposta.ok){
throw new Error(
resultado.error||
"Erro HTTP "+resposta.status
);
}

const cenas=validarCenas(
extrairCenas(resultado),d
);

/*
 Mantém a mesma estrutura de projeto
 da versão 3.0 para preservar
 visualização, salvamento e exportação.
*/
projeto={
versao:4,
serie:d.serie,
episodio:d.episodio,
ideia:d.ideia,
personagens:d.personagens,
estilo:d.estilo,
formato:d.formato,
tom:d.tom,
duracao:d.duracao,
idioma:d.idioma,
emocao:d.emocao,
anterior:d.anterior,
instrucoes:d.extra,
cenas
};

mostrarProjeto();

status(
"❤️ Roteiro recebido!\n"+
"Confira as cenas e toque no botão "+
"Salvar episódio do criador original."
);

el("resultado").scrollIntoView({
behavior:"smooth",
block:"start"
});

}catch(e){
status(
"Não foi possível gerar com IA:\n"+
e.message+
"\n\nO aplicativo original continua disponível."
);
}finally{
botao.disabled=false;
}
};

})();
</script>
